  function extFin(){
    var E = (typeof espelhoData!=="undefined" && espelhoData) ? espelhoData : null;
    var own = {}; J().money.tx.forEach(function(t){ own[t.id] = 1; });
    var tx = E && Array.isArray(E.lancamentos) ? E.lancamentos.filter(function(l){ return l && l.data && !own[l.id]; }).map(function(l){
      var v = Number(l.valor)||0;
      return {id:l.id, tipo:v<0?"saida":"entrada", valor:Math.abs(v), desc:l.desc, cat:v<0?"outros":"reembolso", data:String(l.data).slice(0,10), conta:l.conta, ext:true, pend:l.status==="pendente"};
    }) : [];
    var contas = E && Array.isArray(E.contas) ? E.contas : [];
    return {tx:tx, contas:contas, quando:E ? (E.atualizadoEmTexto||"") : ""};
  }

  function monthTx(mk){ return allTx().filter(function(t){ return String(t.data).slice(0,7)===mk; }); }
  function sums(mk){
    var tx = monthTx(mk), ent = 0, sai = 0;
    tx.forEach(function(t){ if(t.tipo==="entrada") ent += t.valor; else sai += t.valor; });
    return {ent:ent, sai:sai, saldo:ent-sai};

    return b.venc ? parseKey(b.venc) : null;
  }

  function sleepHours(e){
    if(!e || !e.deitou || !e.acordou) return null;
    var a = toMin(e.deitou), b = toMin(e.acordou); if(b <= a) b += 1440; return (b-a)/60;
  }
  function lastSleep(){
    var s = J().sleep; for(var i=0;i<3;i++){ var k = todayKey(-i); if(s[k]) return {k:k, e:s[k], h:sleepHours(s[k])}; } return null;
  }
  function sleepWeek(){ var out = []; for(var i=6;i>=0;i--){ var d = addDays(new Date(), -i); var e = J().sleep[dKey(d)]; out.push({d:d, h:sleepHours(e)}); } return out; }

  function cycleInfo(){
    var c = J().cycle, s = (c.starts||[]).slice().sort();
    if(!s.length) return null;
    var lens = []; for(var i=1;i<s.length;i++){ var gap = Math.round((parseKey(s[i])-parseKey(s[i-1]))/86400000); if(gap>=18 && gap<=45) lens.push(gap); }
    var len = lens.length ? Math.round(lens.slice(-6).reduce(function(a,b){return a+b;},0)/Math.min(6,lens.length)) : (+c.len||28);
    var last = parseKey(s[s.length-1]);
    var next = addDays(last, len), today = new Date(); today = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    while(next < today) next = addDays(next, len);
    return {len:len, last:last, next:next, dur:+c.dur||5, inDays:Math.round((next-today)/86400000), day:Math.round((today-last)/86400000)+1};
  }
  function periodClass(d){
    var c = J().cycle, info = cycleInfo(); if(!info) return "";
    var dur = info.dur;
    for(var i=0;i<(c.starts||[]).length;i++){ var st = parseKey(c.starts[i]); var diff = Math.round((d-st)/86400000); if(diff>=0 && diff<dur) return "period"; }
    var pd = Math.round((d-info.next)/86400000); if(pd>=0 && pd<dur) return "pred";
    return "";
  }

  function viewSono(){
    var ls = lastSleep(), goal = +J().sleepGoal||7, wk = sleepWeek();
    var vals = wk.filter(function(x){ return x.h; }).map(function(x){ return x.h; });
    var avg = vals.length ? vals.reduce(function(a,b){return a+b;},0)/vals.length : null;
    var best = vals.length ? Math.max.apply(null, vals) : null;
    var inGoal = vals.filter(function(h){ return h>=goal-0.01; }).length;
    var debt = wk.reduce(function(a,x){ return a + (x.h!=null ? Math.max(0, goal-x.h) : 0); },0);
    var h = new Date().getHours();
    var maxH = Math.max(goal+1, best||0, 9);
    var plotH = 104, goalTop = 18 + Math.round(plotH*(1-goal/maxH));
    return ''+
    '<section class="ju-night"><span class="ju-label">'+(h<12?"Bom dia":h<18?"Boa tarde":"Boa noite")+'</span><h2>'+(ls?"Como foi sua noite?":"Vamos acompanhar seu sono?")+'</h2>'+
      '<div class="row">'+ring(ls&&ls.h?ls.h/goal:0, ls?hm(ls.h):"—", ls&&ls.h?Math.round(ls.h/goal*100)+"% da meta":"sem registro", "#C9B8F5", 96)+
      '<div><div style="font-weight:600">'+(ls?"Última noite: "+hm(ls.h):"Registre sua primeira noite")+'</div>'+
      '<div style="font-size:13px;color:#DCCDEB">'+(ls ? (ls.h>=goal?"Meta de sono alcançada.":"Faltaram "+hm(goal-ls.h)+" para a meta.") : "Leva 10 segundos, ao acordar.")+'</div>'+
      '<span class="pill">🎯 meta '+hm(goal)+'</span>'+(ls?'<span class="pill">🛏️ '+esc(ls.e.deitou)+' → '+esc(ls.e.acordou)+'</span>':'')+'</div></div>'+
      '<button class="ju-btn block" data-act="sleep">'+ico("plus")+' Registrar minha noite</button></section>'+
    '<div class="ju-grid">'+
      stat("🌙","Média da semana", avg?hm(avg):"—")+stat("🏆","Melhor noite", best?hm(best):"—")+

  function gym(){ var j = J(); if(!j.gym || typeof j.gym!=="object") j.gym = {log:{}, sess:{}}; j.gym.log = j.gym.log||{}; j.gym.sess = j.gym.sess||{}; return j.gym; }

  // =====================================================================
  // Lunora inteligente: captura em linguagem natural, Tríade do Tempo,
  // modo foco com a lua, relatório de foco, janelas livres e gasto diário.
  // =====================================================================
  var LN_WD = {domingo:0, segunda:1, terca:2, quarta:3, quinta:4, sexta:5, sabado:6};
  var LN_APPT = /\b(consulta|reuni[aã]o|m[eé]dic[oa]|dentista|aula|entrevista|call|encontro|anivers[aá]rio|exame|prova|visita|festa|jantar com|almo[cç]o com|viagem|voo|vacina|terapia|psic[oó]log|fisioterapia|manicure|cabeleireir|sal[aã]o|culto|missa|casamento|batizado|show|cinema)\b/i;
  var LN_IMPORT = /\b(pagar|boleto|fatura|conta de|prova|entrega|entregar|prazo|m[eé]dic|consulta|exame|vencimento|vence|documento|contrato|imposto|ir\b|declara[cç][aã]o|matr[ií]cula|inscri[cç][aã]o|estudar|treino|or[cç]amento|renovar|banco|cart[oó]rio)\b/i;
  var LN_CIRC = /\b(ver (o |a )?(v[ií]deo|s[eé]rie|story)|olhar|dar uma olhada|talvez|se der|qualquer hora|um dia|responder grupo|rede social|instagram|tiktok)\b/i;
  var LN_WORK = /\b(cliente|reuni[aã]o|relat[oó]rio|e-?mail|cota[cç][aã]o|proposta|chefe|equipe|projeto|apresenta[cç][aã]o|planilha|fornecedor|pedido|venda|meta)\b/i;
  function lnNorm(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); }
  function lnHM(h, m){ return String(Math.min(23,Math.max(0,h))).padStart(2,"0")+":"+String(Math.min(59,Math.max(0,m||0))).padStart(2,"0"); }

  // Entende frases como "dentista amanhã às 15h @ Clínica Sorriso", "pagar luz dia 20!",
  // "reunião com cliente sexta 9h30", "estudar inglês daqui a 3 dias".
  function lnParse(raw){
    var txt = " " + String(raw||"").trim() + " ", n = lnNorm(txt), today = new Date(), date = null, time = null, place = "";
    function cut(re){ var m = n.match(re); if(!m) return null; var i = m.index, L = m[0].length; txt = txt.slice(0,i) + " " + txt.slice(i+L); n = n.slice(0,i) + " " + n.slice(i+L); return m; }
    var m;
    if((m = txt.match(/\s@\s*([^@]+)$/))){ place = m[1].trim(); txt = txt.slice(0, m.index) + " "; n = lnNorm(txt); }
    var urgent = /!\s*$|\burgente\b|\bsem falta\b/.test(n); cut(/\s*!+\s*$/); cut(/\burgente\b/); cut(/\bsem falta\b/);
    // horário
    if((m = cut(/\b(?:as|a partir das|ate as)?\s*(\d{1,2})\s*(?:h|:)\s*(\d{2})?\s*(?:hs|horas|h)?\b/))) time = lnHM(+m[1], +(m[2]||0));
    else if((m = cut(/\b(?:as|às)\s+(\d{1,2})\b/))) time = lnHM(+m[1], 0);
    if(time && /\b(da noite|a noite)\b/.test(n) && +time.slice(0,2) < 12) time = lnHM(+time.slice(0,2)+12, +time.slice(3));
    if(time && /\b(da tarde|a tarde)\b/.test(n) && +time.slice(0,2) < 12) time = lnHM(+time.slice(0,2)+12, +time.slice(3));
    cut(/\b(da noite|a noite|da tarde|a tarde|da manha|de manha)\b/);
    // data
    if(cut(/\bdepois de amanha\b/)) date = addDays(today, 2);
    else if(cut(/\bamanha\b/)) date = addDays(today, 1);
    else if(cut(/\bhoje\b/)) date = today;
    else if((m = cut(/\bdaqui a (\d{1,2}) dias?\b/))) date = addDays(today, +m[1]);
    else if((m = cut(/\bdaqui a (\d{1,2}) semanas?\b/))) date = addDays(today, 7*m[1]);
    else if(cut(/\b(semana que vem|proxima semana)\b/)){ var dd = (8 - today.getDay()) % 7 || 7; date = addDays(today, dd); }
    else if(cut(/\b(no |neste |nesse )?fim de semana\b/)){ var ds = (6 - today.getDay() + 7) % 7; date = addDays(today, ds); }
    else if(cut(/\b(no )?fim do mes\b/)) date = new Date(today.getFullYear(), today.getMonth()+1, 0);
    else if((m = cut(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))){ var y = m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : today.getFullYear(); date = new Date(y, +m[2]-1, +m[1]); if(!m[3] && date < addDays(today,-1)) date.setFullYear(y+1); }
    else if((m = cut(/\b(?:dia|no dia)\s+(\d{1,2})\b/))){ date = new Date(today.getFullYear(), today.getMonth(), +m[1]); if(date < addDays(today,-1)) date = new Date(today.getFullYear(), today.getMonth()+1, +m[1]); }
    else if((m = cut(/\b(?:(?:na|no|nessa|nesta|proxima|proximo)\s+)?(domingo|segunda|terca|quarta|quinta|sexta|sabado)(?:-feira| feira)?\b/))){ var wd = LN_WD[m[1]], diff = (wd - today.getDay() + 7) % 7; if(diff===0 && /proxim/.test(m[0])) diff = 7; date = addDays(today, diff); }
    var title = txt.replace(/\s+/g," ").replace(/\s+(as|às|dia|no|na|para|pra|em|de|do|da|com|ate|até)\s*$/i,"").replace(/^\s*(lembrar de|lembrar|preciso|tenho que|tenho de)\s+/i,"").trim();
    title = title.charAt(0).toUpperCase() + title.slice(1);
    var appt = !!time && (LN_APPT.test(raw) || !!place);
    var tri = urgent ? "urgente" : LN_CIRC.test(raw) ? "circunstancial" : (LN_IMPORT.test(raw) || appt) ? "importante" : (date && dKey(date) <= todayKey(1) ? "urgente" : "importante");
    return { title: title, date: date ? dKey(date) : null, time: time, place: place, appt: appt, triade: tri, tag: LN_WORK.test(raw) ? "trabalho" : "pessoal" };
  }
  var LN_TRI = { importante:{l:"Importante", c:"#2F7D5B", s:"#E2EFE7"}, urgente:{l:"Urgente", c:"#B4434F", s:"#F6E1E6"}, circunstancial:{l:"Circunstancial", c:"#8A7A86", s:"#EFE9EE"} };
  var lnQuickTri = null;
  function lnPreview(p){
    if(!p || !p.title) return '<span class="ln-hint">Ex.: <i>dentista amanhã 15h @ Clínica Sorriso</i> · <i>pagar luz dia 20!</i></span>';

    return '<span class="ln-tag">'+(p.appt ? "📅 Compromisso" : "✓ Tarefa")+'</span><span class="ln-tag">🗓 '+esc(d)+'</span>'+(p.time?'<span class="ln-tag">⏰ '+esc(p.time)+'</span>':'')+
      (p.place?'<span class="ln-tag">📍 '+esc(p.place)+'</span>':'')+'<button type="button" class="ln-tag ln-tri" data-lntri style="color:'+tri.c+';background:'+tri.s+'" title="Tocar para trocar">● '+tri.l+'</button>'+
      '<span class="ln-tag">'+(p.tag==="trabalho"?"💼 Trabalho":"🌿 Pessoal")+'</span>';
  }

  // Tríade do Tempo: o ideal é ~70% importante, ~20% urgente, ~10% circunstancial.
  function lnTriOf(t){ return t.triade || lnParse(t.texto).triade; }
  function lnTriadeCard(){
    var pend = J().tasks.filter(function(t){ return !t.feita; }); if(!pend.length) return "";

      '<div class="ju-field" data-if="treino">Prefiro treinar'+seg("treinoTurno", [["manha","De manhã"],["tarde","À tarde"],["noite","À noite"]], p.treinoTurno||"manha")+'</div>'+
      '<label class="ju-field" data-if="estudos">Horário de estudo<input name="estudoHora" type="time" value="'+esc(p.estudoHora||"20:00")+'"></label>'+
      '<label class="ju-field">Meta de sono (horas)<input name="sleepGoal" type="number" min="5" max="10" step="0.5" value="'+(+J().sleepGoal||8)+'"></label>',
      function(f){
        var nome = f.nome.value.trim(); if(!nome) return "Conte como você quer ser chamada.";
        var ar = [].slice.call(f.querySelectorAll('input[name="area"]:checked')).map(function(i){ return i.value; });
        if(!ar.length) return "Escolha pelo menos uma área para organizar.";
        var np = { name: nome.split(/\s+/)[0], areas: ar, wake: f.wake.value||"06:30", sleep: f.sleep.value||"22:30",
          workIni: f.workIni.value, workFim: f.workFim.value, treinoTurno: segVal(f,"treinoTurno")||"manha", estudoHora: f.estudoHora.value||"20:00", done: true, since: todayKey() };
        var first = !p.done, j = J();
        j.profile = np;
        var sg = +f.sleepGoal.value; if(sg>=5 && sg<=10) j.sleepGoal = sg;
        state.dayPlan = state.dayPlan || {}; state.dayPlan.blocks = lnBuildBlocks(np);
        if(first || !j.habits || !j.habits.length) j.habits = lnHabits(np);
        save(); renderAll(); lnRefreshTop(); go("inicio");
        toast(first ? "Prontinho, "+np.name+"! Seu dia já está montado." : "Cadastro atualizado");
      },
      { ok: p.done ? "Salvar" : "Começar", noFocus: true, onOpen: function(f, dlg){
          function sync(){ var on = [].slice.call(f.querySelectorAll('input[name="area"]:checked')).map(function(i){ return i.value; });
            f.querySelectorAll("[data-if]").forEach(function(el){ el.hidden = on.indexOf(el.dataset.if) < 0; }); }
          f.addEventListener("change", sync); sync();
          if(!p.done){ var c = f.querySelector("[data-close]"); if(c) c.textContent = "Agora não"; }
        } });
  }
  function lnDemoBar(){
    if(!window.LUNORA_DEMO || document.getElementById("lnDemo")) return;
    var b = document.createElement("div"); b.id = "lnDemo"; b.className = "ln-demo";
    b.innerHTML = '<span>✨ Demonstração com dados de exemplo</span><button type="button" id="lnDemoReset">Recomeçar do zero</button>';
    document.body.appendChild(b);
    document.getElementById("lnDemoReset").addEventListener("click", function(){ try{ localStorage.clear(); sessionStorage.setItem("lnDemoEmpty","1"); }catch(e){} location.reload(); });
  }

  function shellStart(){ go(juView); setTimeout(lnMaybeOnboard, 400); lnDemoBar(); }


  async function init(){
    initToday();
    initTabs();
    initBackups();
    initAppInstall();
    initAccount();
    initShell();
    var cache = readJSON(CACHE_KEY);
    state = cache ? mergeDefaults(cache) : cloneDefaults();
    stateDoc = localStore;
    reconcileState();
    renderAll();
    shellStart();
    setSaveStatus("saving", cache ? "Abrindo seus dados…" : "Entre para carregar seus dados");
    try{
      var ok = await connect();
      if(!ok){ updateAccountUi(); setSaveStatus("ok", cache ? "Salvo neste aparelho — entre para sincronizar" : "Entre para carregar seus dados"); }
    }catch(e){
      console.warn("painel: conta indisponível", e);
      updateAccountUi();
      setSaveStatus(navigator.onLine ? "error" : "ok", navigator.onLine ? "Não foi possível conectar à conta agora" : "Sem internet — usando os dados deste aparelho");
    }
    setInterval(function(){ subscribeDirecao(); renderAgora(); }, 30000);
    document.addEventListener("visibilitychange", function(){ if(!document.hidden){ subscribeDirecao(); renderAgora(); } });
  }

  document.addEventListener("DOMContentLoaded", init);
  if("serviceWorker" in navigator && window.isSecureContext && location.protocol!=="file:"){
    window.addEventListener("load",function(){
      navigator.serviceWorker.register("./service-worker.js").catch(function(error){
        console.error("Falha ao registrar suporte offline:",error);
      });
    });
  }
})();
</script>
