  // ---------- render: Financeiro ----------
  function financeMonths(start,end){
    var result=[];
    for(var month=start;month<=end;month++) result.push("2026-"+String(month).padStart(2,"0"));
    return result;
  }
  function financeMonthLabel(key,options){
    var parts=key.split("-");
    return new Date(Number(parts[0]),Number(parts[1])-1,1).toLocaleDateString("pt-BR",options||{month:"short"});
  }
  function financeNumber(value){
    if(value===null||value===undefined||value==="") return null;
    var amount=Number(value);
    return Number.isFinite(amount)?amount:null;
  }
  function financeDisplay(value){
    var amount=financeNumber(value);
    return amount===null?"—":brl(amount);
  }
  function financeRecord(key){
    return state.finance.months[key]||{};
  }
  function financeInput(key,field,label,disabled){
    var value=financeNumber(financeRecord(key)[field]);
    return '<input type="number" '+(field==="income"?'min="0"':'')+' step="0.01" inputmode="decimal" data-fin-month="'+key+'" data-fin-field="'+field+'" aria-label="'+esc(label)+' — '+esc(financeMonthLabel(key,{month:"long"}))+'" value="'+(value===null?"":value)+'" placeholder="—" '+(disabled?"disabled":"")+'>';
  }
  function financeAverage(values){
    var valid=values.map(financeNumber).filter(function(value){return value!==null;});
    return valid.length?valid.reduce(function(sum,value){return sum+value;},0)/valid.length:null;
  }
  function financeSum(values){
    var valid=values.map(financeNumber).filter(function(value){return value!==null;});
    return valid.length?valid.reduce(function(sum,value){return sum+value;},0):null;
  }
  function financeChart(keys,fields,maxValue,stacked){
    return '<div class="finance-chart">'+keys.map(function(key){
      var record=financeRecord(key);
      return '<div class="finance-bar"><strong>'+(financeNumber(record[fields[0]])===null?"—":brl(financeNumber(record[fields[0]])))+'</strong>'+
        '<div class="finance-bar-track">'+fields.map(function(field,index){
          var amount=financeNumber(record[field]);
          var height=amount===null||!maxValue?0:Math.max(2,Math.min(100,amount/maxValue*100));
          var type=field==="homeJu"?"ju":(field==="homeTransfer"?"transfer":(field==="unidentified"?"unknown":""));
          return '<i class="'+type+'" style="height:'+height.toFixed(1)+'%" title="'+esc(field)+' · '+esc(financeDisplay(amount))+'"></i>';
        }).join("")+'</div><span>'+esc(financeMonthLabel(key))+'</span></div>';
    }).join("")+'</div>';
  }
  function financeCategoryRows(kind,items){
    if(!items.length) return '<div class="finance-empty">Ainda não há lançamentos categorizados. Os dados ausentes ficam em branco, não são tratados como R$ 0.</div>';
    return '<div class="finance-category-list">'+items.map(function(item){
      return '<div class="finance-category-row"><span>'+esc(item.category)+'</span><span class="month">'+esc(financeMonthLabel(item.month))+'</span><span class="amount">'+brl(Number(item.amount)||0)+'</span><button class="btn ghost" type="button" data-fin-delete="'+kind+'" data-fin-id="'+esc(item.id)+'" aria-label="Remover categoria '+esc(item.category)+'">Remover</button></div>';
    }).join("")+'</div>';
  }
  function financeComparison(label,first,second){
    if(first===null||second===null) return '<div class="stat-tile"><p class="label">'+label+'</p><p class="value">Aguardando dados</p><p class="hint">Preencha os meses de comparação para ver a variação.</p></div>';
    var delta=second-first, pct=first===0?null:delta/Math.abs(first)*100;
    return '<div class="stat-tile '+(delta>0?"tone-warn":(delta<0?"tone-ok":""))+'"><p class="label">'+label+'</p><p class="value">'+(delta>0?"+":"")+brl(delta)+'</p><p class="hint">'+(pct===null?"sem base percentual":(pct>0?"+":"")+pct.toFixed(1).replace(".",",")+"%")+' · antes '+brl(first)+' / depois '+brl(second)+'</p></div>';
  }
  function financeReportTrend(items,beforeLabel,afterLabel){
    return '<div class="finance-table-wrap"><table class="finance-table"><thead><tr><th>Setor/categoria</th><th>'+beforeLabel+'</th><th>'+afterLabel+'</th><th>Variação/mês</th><th>Sinal</th></tr></thead><tbody>'+
      items.map(function(item){
        var delta=item.delta===undefined?item.after-item.before:item.delta,up=delta>0.5,down=delta<-.5;
        return '<tr><td>'+esc(item.name)+'</td><td>'+brl(item.before)+'</td><td>'+brl(item.after)+'</td><td class="'+(up?"finance-bad":(down?"finance-good":""))+'">'+(delta>0?"+":"")+brl(delta)+'</td><td class="'+(up?"finance-bad":(down?"finance-good":""))+'">'+(up?"regressão":(down?"progresso":"estável"))+'</td></tr>';
      }).join("")+'</tbody></table></div>';
  }
  function renderFinanceiro(){
    var el=document.getElementById("panel-financeiro");
    var F=state.finance;
    if(!F||typeof F!=="object") F=state.finance={months:{},individualCategories:[],homeSectors:[],openingBalance:null,scenarios:{optimistic:1.25,base:1,conservative:.75}};
    if(!F.months||typeof F.months!=="object") F.months={};
    if(!Array.isArray(F.individualCategories)) F.individualCategories=[];
    if(!Array.isArray(F.homeSectors)) F.homeSectors=[];
    if(!F.scenarios) F.scenarios={optimistic:1.25,base:1,conservative:.75};
    var report=F.reportSnapshot;
    if(!report||!report.individual||!report.home){
      el.innerHTML='<div class="card"><div class="section-head"><h2>Financeiro</h2></div><p class="section-lede">Entre na sua conta para ver o resumo financeiro.</p></div>';
      return;
    }
    var allMonths=financeMonths(1,10), personalMonths=financeMonths(3,10), homeMonths=financeMonths(1,8);
    var monthRows=allMonths.map(function(key){
      var personalOutside=key<"2026-03"||key>"2026-10";
      var homeOutside=key>"2026-10";
      var note=report.monthNotes[key]||"";
      return '<tr><td>'+esc(financeMonthLabel(key,{month:"long"}))+'</td>'+
        '<td>'+financeInput(key,"income","Entrada",personalOutside)+'</td>'+
        '<td>'+financeInput(key,"individual","Gasto individual",personalOutside)+'</td>'+
        '<td>'+financeInput(key,"homeJu","Lar pago diretamente pela Ju",homeOutside)+'</td>'+
        '<td>'+financeInput(key,"homeTransfer","PIX ao André",homeOutside)+'</td>'+
        '<td>'+financeInput(key,"homeAndre","Lar pago pelo André",homeOutside)+'</td>'+
        '<td>'+financeInput(key,"andreForJu","André pagou por Ju, fora do custo do Lar",homeOutside)+'</td>'+
        '<td>'+financeInput(key,"unidentified","A identificar",personalOutside)+'</td>'+
        '<td>'+financeDisplay(financeRecord(key).cashFlow)+'</td><td class="finance-month-note">'+(note?"* "+esc(note):"")+'</td></tr>';
    }).join("");
    var personalIn=financeSum(personalMonths.map(function(key){return financeRecord(key).income;}));
    var individualOut=financeSum(personalMonths.map(function(key){return financeRecord(key).individual;}));
    var houseJu=financeSum(homeMonths.map(function(key){var r=financeRecord(key);return financeNumber(r.homeJu)===null&&financeNumber(r.homeTransfer)===null?null:(financeNumber(r.homeJu)||0)+(financeNumber(r.homeTransfer)||0);}));
    var houseJuPersonal=financeSum(personalMonths.map(function(key){var r=financeRecord(key);return financeNumber(r.homeJu)===null&&financeNumber(r.homeTransfer)===null?null:(financeNumber(r.homeJu)||0)+(financeNumber(r.homeTransfer)||0);}));
    var houseAndre=financeSum(homeMonths.map(function(key){return financeRecord(key).homeAndre;}));
    var unknownOut=financeSum(personalMonths.map(function(key){return financeRecord(key).unidentified;}));
    var monthlyMax=Math.max.apply(null,personalMonths.reduce(function(values,key){
      var record=financeRecord(key);
      ["income","individual","homeJu","homeAndre","unidentified"].forEach(function(field){
        var value=financeNumber(record[field]);if(value!==null) values.push(value);
      });
      return values;
    },[0]));
    var individualTotals={};
    report.individual.categories.forEach(function(item){individualTotals[item.name]=item.value;});
    F.individualCategories.forEach(function(item){var key=item.category;individualTotals[key]=(individualTotals[key]||0)+(Number(item.amount)||0);});
    var individualCategoryHtml=Object.keys(individualTotals).length?'<div class="finance-category-list">'+Object.keys(individualTotals).sort().map(function(category){
      return '<div class="finance-category-row"><span>'+esc(category)+'</span><span class="month">Mar–out/2026</span><span class="amount">'+brl(individualTotals[category])+'</span><span></span></div>';
    }).join("")+'</div>':'<div class="finance-empty">Adicione gastos individuais por categoria para visualizar para onde o dinheiro está indo.</div>';
    var sectorTotals={};
    report.home.categories.forEach(function(item){sectorTotals[item.name]=item.value;});
    F.homeSectors.forEach(function(item){var key=item.category;sectorTotals[key]=(sectorTotals[key]||0)+(Number(item.amount)||0);});
    var homeMonthsRecorded=homeMonths.filter(function(key){
      var record=financeRecord(key);return financeNumber(record.homeJu)!==null&&financeNumber(record.homeAndre)!==null;
    });
    var homeCostByMonth=homeMonths.map(function(key){
      var record=financeRecord(key),ju=financeNumber(record.homeJu),andre=financeNumber(record.homeAndre);
      return ju===null||andre===null?null:ju+andre;
    });
    var homeCostTotal=financeSum(homeCostByMonth);
    var homeCostAverage=financeAverage(homeCostByMonth);
    var individualFirst=financeAverage(["2026-04","2026-05","2026-06"].map(function(key){return financeRecord(key).individual;}));
    var individualRecent=financeAverage(["2026-09","2026-10"].map(function(key){return financeRecord(key).individual;}));
    var homeFirst=financeAverage(["2026-01","2026-02","2026-03","2026-04"].map(function(key){var r=financeRecord(key);var a=financeNumber(r.homeJu),b=financeNumber(r.homeAndre);return a===null||b===null?null:a+b;}));
    var homeRecent=financeAverage(["2026-05","2026-06","2026-07","2026-08"].map(function(key){var r=financeRecord(key);var a=financeNumber(r.homeJu),b=financeNumber(r.homeAndre);return a===null||b===null?null:a+b;}));
    var completeHomeMonths=homeMonths.filter(function(key){var r=financeRecord(key);return financeNumber(r.homeJu)!==null&&financeNumber(r.homeAndre)!==null;});
    var knownDeltas=completeHomeMonths.map(function(key){
      var r=financeRecord(key),ju=financeNumber(r.homeJu),andre=financeNumber(r.homeAndre);
      return ju+(financeNumber(r.homeTransfer)||0)-(ju+andre)/2-(financeNumber(r.andreForJu)||0);
    });
    var currentSettlement=financeNumber(F.openingBalance);
    if(currentSettlement!==null) currentSettlement+=knownDeltas.reduce(function(sum,value){return sum+value;},0);
    var averageDelta=financeAverage(knownDeltas.slice(-3));
    var scenarioValues=averageDelta===null?null:{
      base:averageDelta*(Number(F.scenarios.base)||1),
      optimistic:averageDelta*(Number(F.scenarios.optimistic)||1.25),
      conservative:averageDelta*(Number(F.scenarios.conservative)||.75)
    };
    var scenarioCard=function(key,label,description){
      if(currentSettlement===null||scenarioValues===null) return '<div class="finance-scenario"><strong>'+label+'</strong><span>Inclua saldo de abertura e pelo menos um mês completo (valores pagos por ambos) para projetar.</span></div>';
      var rate=scenarioValues[key],monthsToZero=currentSettlement>=0?0:(rate>0?Math.ceil(Math.abs(currentSettlement)/rate):null);
      var result=monthsToZero===0?"Acerto já está zerado":(monthsToZero===null?"Sem previsão de quitação neste ritmo":"Pode zerar em cerca de "+monthsToZero+" mês(es)");
      return '<div class="finance-scenario"><strong>'+label+'</strong><span>'+description+' · variação estimada '+brl(rate)+'/mês. '+result+'.</span></div>';
    };
    var latestDate=new Date();
    var projectionRows='<div class="finance-projection-row head"><span>Mês</span><span>Base</span><span>Otimista</span><span>Conservador</span></div>';
    var projectionValues={base:currentSettlement,optimistic:currentSettlement,conservative:currentSettlement};
    var projectionHtml="";
    if(currentSettlement!==null&&scenarioValues!==null){
      for(var pi=0;pi<12;pi++){
        latestDate.setMonth(latestDate.getMonth()+1);
        var label=latestDate.toLocaleDateString("pt-BR",{month:"short",year:"2-digit"}).replace(".","");
        ["base","optimistic","conservative"].forEach(function(key){projectionValues[key]+=scenarioValues[key];});
        projectionHtml+='<div class="finance-projection-row"><span>'+esc(label)+'</span>'+["base","optimistic","conservative"].map(function(key){
          var value=projectionValues[key];return '<span class="'+(value<0?"finance-bad":"finance-good")+'">'+brl(value)+'</span>';
        }).join("")+'</div>';
      }
    }
    var sectorHtml=Object.keys(sectorTotals).length?'<div class="finance-category-list">'+Object.keys(sectorTotals).sort().map(function(category){
      return '<div class="finance-category-row"><span>'+esc(category)+'</span><span class="month">Jan–ago/2026</span><span class="amount">'+brl(sectorTotals[category])+'</span><span></span></div>';
    }).join("")+'</div>':'<div class="finance-empty">Nenhum setor do Lar foi informado. Adicione os valores setorizados abaixo; totais sem informação não são tratados como zero.</div>';
    var expenseMax=Math.max.apply(null,Object.keys(individualTotals).map(function(key){return individualTotals[key];}).concat([1]));
    var sectorMax=Math.max.apply(null,Object.keys(sectorTotals).map(function(key){return sectorTotals[key];}).concat([1]));
    function categoryBars(totals,max){
      return Object.keys(totals).length?'<div class="finance-chart">'+Object.keys(totals).sort(function(a,b){return totals[b]-totals[a];}).map(function(category){
        var amount=totals[category];return '<div class="finance-bar"><strong>'+brl(amount)+'</strong><div class="finance-bar-track"><i style="height:'+Math.max(2,amount/max*100).toFixed(1)+'%"></i></div><span>'+esc(category.slice(0,12))+'</span></div>';
      }).join("")+'</div>':'';
    }
    el.innerHTML=
      '<div class="finance-note"><strong>Atualizado pelo relatório de '+esc(report.generated)+'.</strong> '+esc(report.quality.total+' lançamentos: '+report.quality.selected+' setorizados pela Ju, '+report.quality.automatic+' classificados automaticamente e '+report.quality.suggested+' ainda seguem uma sugestão provisória.')+' O resumo mantém essas classificações como vieram no arquivo; confira os itens sugeridos antes de tratar os totais como definitivos.</div>'+
      '<div class="stat-tiles">'+
        '<div class="stat-tile tone-t"><p class="label">Entradas mar–out</p><p class="value">'+brl(report.individual.total.income)+'</p><p class="hint">Salário '+brl(report.individual.total.salary)+' · Flash '+brl(report.individual.total.flash)+'</p></div>'+
        '<div class="stat-tile"><p class="label">Gastos individuais</p><p class="value">'+brl(report.individual.total.spending)+'</p><p class="hint">Mar–out · relatório recebido</p></div>'+
        '<div class="stat-tile"><p class="label">Lar — contribuição Ju</p><p class="value">'+brl(report.individual.total.homeContribution)+'</p><p class="hint">Contas pagas + PIX ao André · mar–out</p></div>'+
        '<div class="stat-tile tone-warn"><p class="label">A identificar</p><p class="value">'+brl(report.individual.total.unidentified)+'</p><p class="hint">Sem classificação confirmada</p></div>'+
      '</div>'+
      '<div class="card"><div class="section-head"><h2>Entradas e saídas por mês</h2><span class="chip on-tab">Mar–out · R$</span></div>'+
        '<p class="section-lede">Valores importados do resumo financeiro; edite os campos quando tiver correções confirmadas. Lançamentos negativos representam estorno/crédito. Saldo mensal é o saldo informado no relatório.</p>'+
        '<div class="stat-tiles">'+
          '<div class="stat-tile tone-t"><p class="label">Entradas registradas</p><p class="value">'+financeDisplay(personalIn)+'</p></div>'+
          '<div class="stat-tile"><p class="label">Gastos individuais</p><p class="value">'+financeDisplay(individualOut)+'</p></div>'+
          '<div class="stat-tile"><p class="label">Lar — Ju, pagos + PIX</p><p class="value">'+financeDisplay(houseJuPersonal)+'</p></div>'+
          '<div class="stat-tile"><p class="label">A identificar</p><p class="value">'+financeDisplay(unknownOut)+'</p></div>'+
        '</div>'+
        '<div class="finance-legend"><span><i></i>Entradas</span><span><i class="ju"></i>Gastos individuais</span><span><i class="transfer"></i>Lar · Ju + PIX</span><span><i class="unknown"></i>A identificar</span></div>'+
        '<div class="finance-chart">'+personalMonths.map(function(key){
          var r=financeRecord(key),bars=[["income",financeNumber(r.income),"","Entradas"],["individual",financeNumber(r.individual),"spending","Gastos individuais"],["homeJu",(financeNumber(r.homeJu)||0)+(financeNumber(r.homeTransfer)||0),"transfer","Lar · Ju + PIX"],["unidentified",financeNumber(r.unidentified),"unknown","A identificar"]];
          return '<div class="finance-bar"><strong>'+financeDisplay(r.cashFlow)+'</strong><div class="finance-bar-track">'+bars.map(function(bar){var amount=bar[1],height=amount===null||!monthlyMax?0:Math.max(2,Math.abs(amount)/monthlyMax*100);return '<i class="'+bar[2]+'" style="height:'+height.toFixed(1)+'%" title="'+esc(bar[3]+' · '+financeDisplay(amount))+'"></i>';}).join("")+'</div><span>'+esc(financeMonthLabel(key))+(report.monthNotes[key]?"*":"")+'</span></div>';

  // ---------- one-time repair: heal saved data left in an old shape ----------
  // mergeDefaults() only fills in keys the saved doc never had — it never overwrites
  // a key that's already there, even if that key's *shape* is stale from an older
  // version of the app. That's correct for most fields (we don't want to blow away
  // your checkboxes), but it means a saved "professional" object from before the
  // 28/09 rebuild had no .phases array (renderProfissional() crashed reading it,
  // which is why the tab looked empty), and new debt entries never appear on a
  // saved "debts" array that predates them. This patches both without touching
  // anything else you've already filled in.
  function reconcileState(){
    var healed = false;
    if(!state.professional || !Array.isArray(state.professional.phases)){
      // Preserve any action items she's already ticked in "Plano de ação" — a shape
      // rebuild should never erase what she's checked off, only fix the structure.
      var oldProfLog = (state.professional && state.professional.log) || {};
      state.professional = cloneDefaults().professional;
      state.professional.log = oldProfLog;
      healed = true;
    }
    var defDebts = cloneDefaults().debts;
    var haveIds = {};
    state.debts.forEach(function(d){ haveIds[d.id] = true; });
    defDebts.forEach(function(d){
      if(!haveIds[d.id]){ state.debts.push(d); healed = true; }
    });
    // Guard the user's own added data (e.g. books in Leitura) against ever being
    // silently lost to a future shape change: never replace state.reading wholesale,
    // only patch it into a safe shape if it's missing or corrupted, preserving any
    // items already saved.
    if(!state.reading || typeof state.reading !== "object"){
      state.reading = {items:[], targetPerMonth:1};
      healed = true;
    } else if(!Array.isArray(state.reading.items)){
      state.reading.items = [];
      healed = true;
    }
    if(!state.dayPlan || !Array.isArray(state.dayPlan.blocks)){
      state.dayPlan = cloneDefaults().dayPlan;
      healed = true;
    }
    if(!state.texts || typeof state.texts!=="object"){ state.texts = {}; healed = true; }
    if(!Array.isArray(state.agenda)){
      state.agenda = [];
      healed = true;
    }
    if(typeof state.reading.targetPerMonth !== "number"){
      state.reading.targetPerMonth = 1;
      healed = true;
    }
    var finance=state.finance;
    if(!finance||typeof finance!=="object"){
      finance=state.finance={months:{},individualCategories:[],homeSectors:[],openingBalance:null,scenarios:{optimistic:1.25,base:1,conservative:.75}};
      healed=true;
    }
    if(!finance.months||typeof finance.months!=="object"){finance.months={};healed=true;}
    if(!Array.isArray(finance.individualCategories)){finance.individualCategories=[];healed=true;}
    if(!Array.isArray(finance.homeSectors)){finance.homeSectors=[];healed=true;}
    if(!finance.scenarios) finance.scenarios={optimistic:1.25,base:1,conservative:.75};
    if(FINANCE_REPORT && finance.reportVersion!==FINANCE_REPORT.version){
      finance.reportSnapshot=JSON.parse(JSON.stringify(FINANCE_REPORT));
      Object.keys(FINANCE_REPORT.months).forEach(function(key){
        var target=finance.months[key]||(finance.months[key]={});
        var source=FINANCE_REPORT.months[key];
        Object.keys(source).forEach(function(field){
          var previousDefault=key==="2026-09"&&
            false;
          if(previousDefault||target[field]===undefined||target[field]===null){
            if(source[field]!==null||previousDefault) target[field]=source[field];
          }
        });
      });
      finance.reportVersion=FINANCE_REPORT.version;
      healed=true;
    }
    return healed;
  }

  // ---------- conta e sincronização ----------
  // Os dados ficam no seu projeto Supabase (tabela painel_state, protegida por login),
  // com uma cópia no aparelho para abrir rápido e funcionar sem internet.
  var SB_CONFIG_KEY = "painelJuSupabase", CACHE_KEY = "painelJuCacheV2";
  var SB_DEFAULT = { url: "", key: "" };
  var sb = null, sbUser = null, syncTimer = null, syncing = false, dirty = false;

  function readJSON(key){ try{ return JSON.parse(localStorage.getItem(key)||"null"); }catch(e){ return null; } }
  function writeJSON(key, value){ try{ localStorage.setItem(key, JSON.stringify(value)); return true; }catch(e){ return false; } }
  function sbConfig(){ var c = readJSON(SB_CONFIG_KEY) || {}; return { url: c.url || SB_DEFAULT.url, key: c.key || SB_DEFAULT.key }; }

  function loadSdk(){
    if(window.supabase && window.supabase.createClient) return Promise.resolve(window.supabase);
    return new Promise(function(resolve, reject){
      var sc = document.createElement("script");
      sc.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js";
      sc.onload = function(){ window.supabase && window.supabase.createClient ? resolve(window.supabase) : reject(new Error("SDK indisponível")); };
      sc.onerror = function(){ reject(new Error("Sem internet para carregar o login")); };
      document.head.appendChild(sc);
    });
  }

  var localStore = { set: function(value){
    value.__updatedAt = Date.now();
    writeJSON(CACHE_KEY, value);
    dirty = true; scheduleSync();
    return Promise.resolve();
  }};

  function scheduleSync(){
    if(syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(syncUp, 800);
  }
  async function syncUp(){
    if(!dirty) return;
    if(!sb || !sbUser){ setSaveStatus("ok", "Salvo neste aparelho — entre para sincronizar"); return; }
    if(!navigator.onLine){ setSaveStatus("saving", "Sem internet — sincroniza quando voltar"); return; }
    if(syncing){ scheduleSync(); return; }
    syncing = true; dirty = false;
    var res = await sb.from("painel_state").upsert({ user_id: sbUser.id, data: state, updated_at: new Date().toISOString() });
    syncing = false;
    if(res.error){ dirty = true; setSaveStatus("error", "Não sincronizou — tento de novo em instantes"); setTimeout(scheduleSync, 5000); return; }
    var now = new Date();
    setSaveStatus("ok", "Sincronizado às "+String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0"));
  }
  window.addEventListener("online", function(){ if(dirty) scheduleSync(); });

  async function pullFromAccount(){
    var res = await sb.from("painel_state").select("data, updated_at").eq("user_id", sbUser.id).maybeSingle();
    if(res.error) throw res.error;
    var cache = readJSON(CACHE_KEY);
    var remote = res.data && res.data.data;
    if(remote && (!cache || !cache.__updatedAt || (remote.__updatedAt||0) >= cache.__updatedAt)){
      state = mergeDefaults(remote);
      writeJSON(CACHE_KEY, state);
    } else if(cache){
      dirty = true; // o aparelho tem mudanças mais novas: sobe para a conta
    }
    if(reconcileState()) await stateDoc.set(state);
    if(dirty) await syncUp(); else setSaveStatus("ok", "Sincronizado");
    renderAll();
    direcaoDb = direcaoStore; direcaoKey = null; subscribeDirecao();
  }

  // direção do dia (prioridades das automações) — tabela painel_direcao
  var direcaoStore = { collection: function(){ return { doc: function(k){ return {
    onSnapshot: function(next){
      var stop = false;
      function pull(){
        if(!sb || !sbUser || !navigator.onLine) return;
        sb.from("painel_direcao").select("data").eq("user_id", sbUser.id).eq("dia", k).maybeSingle().then(function(r){
          if(stop || r.error) return;
          var d = r.data && r.data.data;
          next({ exists: !!d, data: function(){ return d; } });
        });
      }
      pull();
      var t = setInterval(pull, 120000);
      document.addEventListener("visibilitychange", function(){ if(!document.hidden) pull(); });
      return function(){ stop = true; clearInterval(t); };
    },
    update: async function(patch){
      var cur = (direcaoData && JSON.parse(JSON.stringify(direcaoData))) || {};
      Object.keys(patch).forEach(function(key){

        if(!/^https:\/\/.+/.test(url) || !key) throw new Error("Preencha a URL do projeto e a chave pública.");
        var prev = sbConfig();
        if(prev.url !== url || prev.key !== key){ writeJSON(SB_CONFIG_KEY, { url: url, key: key }); sb = null; }
        var lib = await loadSdk();
        if(!sb) sb = lib.createClient(url, key, { auth: { persistSession: true, autoRefreshToken: true } });
        var r = await sb.auth.signInWithPassword({ email: document.getElementById("sbEmail").value.trim(), password: document.getElementById("sbPassword").value });

  function sleepHours(e){

  function cycleInfo(){
    var c = J().cycle, s = (c.starts||[]).slice().sort();
    if(!s.length) return null;
    var lens = []; for(var i=1;i<s.length;i++){ var gap = Math.round((parseKey(s[i])-parseKey(s[i-1]))/86400000); if(gap>=18 && gap<=45) lens.push(gap); }
    var len = lens.length ? Math.round(lens.slice(-6).reduce(function(a,b){return a+b;},0)/Math.min(6,lens.length)) : (+c.len||28);
    var last = parseKey(s[s.length-1]);
    var next = addDays(last, len), today = new Date(); today = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    while(next < today) next = addDays(next, len);

  }

    JU_PERIODS.forEach(function(p){
      var list = hs.filter(function(h){ return (h.periodo||"manha")===p[0]; });
      if(!list.length) return;
      var dn = list.filter(function(h){ return habitDone(h,k); }).length;
      html += '<div class="ju-period">'+p[1]+' <small>'+dn+'/'+list.length+'</small></div>';

        html += '<div class="ju-habit'+(done?" done":"")+'"><button class="tick" data-habit="'+esc(h.id)+'" aria-label="'+(done?"Desmarcar":"Concluir")+' '+esc(h.nome)+'">'+ico("check")+'</button>'+
          '<div style="min-width:0"><div class="tags"><span class="ju-tag">Hábito</span><span class="ju-streak">'+(st?"🔥 "+st+(st>1?" dias":" dia"):"comece hoje")+'</span></div>'+
          '<div class="nm">'+esc(h.em||"")+' '+esc(h.nome)+'</div>'+sub+'</div>'+

    var reg = 0;
    for(var d=1; d<=daysIn; d++){
      var dt = new Date(y, mo, d), key = dKey(dt), e = J().mood[key];
      if(e && (e.v||e.nota)) reg++;
      var em = e && e.v ? (JU_MOODS.filter(function(x){return x.v===e.v;})[0]||{}).e : (e && e.nota ? "📝" : "");
      var future = dt > new Date();
      cells += '<button data-day="'+key+'" class="'+(key===k?"today ":"")+periodClass(dt)+'"'+(future?' disabled':'')+' aria-label="'+d+'">'+
        (em?'<span class="e">'+em+'</span>':'<span class="e none"></span>')+'<span class="n">'+d+'</span></button>';
    }
    var ci = cycleInfo();
    var liturgia = state.spirituality && state.spirituality.dailyLog && state.spirituality.dailyLog[k];
    var monthLabel = juMonth.toLocaleDateString("pt-BR",{month:"long"});
    return dietaDoDia()+treinoDoDia()+
    '<section class="ju-card" style="'+tone("bemestar")+'"><div class="ju-head"><span class="ic">'+ico("heart")+'</span><h3>Como você está hoje?</h3></div>'+
      '<div class="ju-moods">'+JU_MOODS.map(function(m){ return '<button type="button" data-mood="'+m.v+'" class="'+(mood&&mood.v===m.v?"on":"")+'">'+m.e+'<small>'+m.t+'</small></button>'; }).join("")+'</div>'+
      (mood&&mood.nota?'<p class="ju-muted" style="margin:10px 0 0">“'+esc(mood.nota)+'”</p>':'')+
      '<button class="ju-more" data-act="mood">'+(mood&&mood.nota?"Editar diário":"Escrever no diário")+' '+ico("chev")+'</button></section>'+
    '<section class="ju-card"><div class="ju-head" style="'+tone("bemestar")+'"><span class="ic">'+ico("book")+'</span><h3>Meu diário</h3><span class="ju-muted">'+reg+' registro'+(reg===1?"":"s")+'</span></div>'+
      '<div class="ju-month"><button data-month="-1" aria-label="Mês anterior">'+ico("back")+'</button><h3>'+monthLabel.charAt(0).toUpperCase()+monthLabel.slice(1)+'<small>'+y+'</small></h3><button data-month="1" aria-label="Próximo mês">'+ico("chev")+'</button></div>'+
      '<div class="ju-cal">'+cells+'</div>'+
      '<div class="ju-muted" style="display:flex;gap:14px;margin-top:10px;flex-wrap:wrap"><span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--j-red)"></span> Menstruação</span><span><span style="display:inline-block;width:7px;height:7px;border-radius:50%;border:1.5px dashed var(--j-red)"></span> Previsão</span></div></section>'+
    '<section class="ju-card"><span class="ju-label">Meu ciclo</span><div class="ju-cycle" style="margin-top:8px"><span class="drop">'+ico("drop")+'</span><div>'+
      (ci ? '<b>'+(ci.inDays===0?"Pode começar hoje":"Próxima em "+ci.inDays+" dia"+(ci.inDays>1?"s":""))+'</b><div class="ju-muted">Dia '+ci.day+' do ciclo · ciclo médio de '+ci.len+' dias · previsão '+fmtDay(ci.next)+'</div>'
          : '<b>Vamos acompanhar seu ciclo?</b><div class="ju-muted">Toque em “Registrar hoje” no primeiro dia da menstruação.</div>')+
      '</div></div><button class="ju-btn soft block" style="margin-top:12px" data-act="period">Registrar hoje</button></section>'+
    '<section class="ju-card" style="'+tone("agenda")+'"><div class="ju-head"><span class="ic">'+ico("cross")+'</span><h3>Fé de hoje</h3></div>'+
      (liturgia ? '<p style="margin:0;font-size:14px">'+esc(liturgia.tema||"")+'</p>'+(liturgia.aplicacao?'<p class="ju-muted" style="margin:8px 0 0">'+esc(liturgia.aplicacao)+'</p>':'')
        : '<p class="ju-empty">A liturgia do dia aparece aqui quando estiver registrada no seu painel.</p>')+
      '<button class="ju-more" data-legacy="espirito">Espiritualidade '+ico("chev")+'</button></section>';
  }

  function viewTarefas(){
    var k = todayKey(), ts = J().tasks;
    var late = ts.filter(function(t){ return !t.feita && t.data<k; }), today = ts.filter(function(t){ return !t.feita && t.data===k; });
    var next = ts.filter(function(t){ return !t.feita && t.data>k; }).sort(function(a,b){ return a.data.localeCompare(b.data); });
    var done = ts.filter(function(t){ return t.feita; }).slice(0,8);
    function group(title, list, showDate){
      if(!list.length) return "";
      return '<section class="ju-card"><span class="ju-label">'+title+' · '+list.length+'</span><ul class="ju-list" style="margin-top:10px">'+list.map(function(t){
        return '<li style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center">'+taskRow(t).replace(/^<li/,'<div').replace(/<\/li>$/,'</div>').replace('</span></div>', (showDate?' <small class="ju-muted">· '+fmtDay(parseKey(t.data))+'</small>':'')+'</span></div>')+
          '<button class="ju-del" data-deltask="'+esc(t.id)+'" aria-label="Apagar">'+ico("trash")+'</button></li>'; }).join("")+'</ul></section>';
    }
    var html = '<button class="ju-btn primary block" data-act="task">'+ico("plus")+' Nova tarefa</button>'+
      group("Atrasadas", late, true)+group("Hoje", today, false)+group("Próximas", next, true)+group("Concluídas", done, false);
    if(!ts.length) html += '<section class="ju-card"><p class="ju-empty">Sua lista está vazia. Anote retornos, compras, ligações e o que mais precisar lembrar.</p></section>';
    return html;
  }

  // ---------- Compras do mês: mercado (vem da dieta) + necessidades extras ----------
  var juShopTab = "mercado";
  function shopData(){
    if(!state.shopping || typeof state.shopping!=="object") state.shopping = {items:[]};
    if(!Array.isArray(state.shopping.items)) state.shopping.items = [];
    if(!Array.isArray(state.shopping.extras)) state.shopping.extras = [];
    return state.shopping;
  }
  function shopRow(i, kind){
    return '<li style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center"><div class="ju-check'+(i.checked?" done":"")+'">'+
      '<button data-shop="'+esc(kind+":"+i.id)+'" aria-label="'+(i.checked?"Desmarcar":"Marcar")+'">'+ico("check")+'</button><span>'+esc(i.text)+'</span></div>'+
      '<button class="ju-del" data-delshop="'+esc(kind+":"+i.id)+'" aria-label="Remover">'+ico("trash")+'</button></li>';
  }
  function viewCompras(){
    var S = shopData(), tab = juShopTab;
    var list = tab==="mercado" ? S.items : S.extras;
    var done = list.filter(function(i){ return i.checked; }).length;
    var groups = {}, order = [];
    list.forEach(function(i){ var c = i.category || (tab==="mercado" ? "Outros" : "Extras"); if(!groups[c]){ groups[c] = []; order.push(c); } groups[c].push(i); });
    var head = '<div class="ju-grid">'+
      '<button class="ju-btn '+(tab==="mercado"?"primary":"soft")+'" data-shoptab="mercado">🛒 Mercado</button>'+
      '<button class="ju-btn '+(tab==="extras"?"primary":"soft")+'" data-shoptab="extras">🧴 Necessidades extras</button></div>';
    var intro = tab==="mercado"
      ? '<p class="ju-muted" style="margin:0">Ingredientes do cardápio da dieta, por categoria. Marque o que já foi para o carrinho.</p>'
      : '<p class="ju-muted" style="margin:0">Tudo o que o mês pede além do mercado da dieta: casa, higiene, farmácia, pet, presentes.</p>';
    var body = list.length ? order.map(function(c){
        return '<section class="ju-card"><span class="ju-label">'+esc(c)+' · '+groups[c].filter(function(i){return i.checked;}).length+'/'+groups[c].length+'</span><ul class="ju-list" style="margin-top:10px">'+groups[c].map(function(i){ return shopRow(i, tab); }).join("")+'</ul></section>';
      }).join("")
      : '<section class="ju-card"><p class="ju-empty">'+(tab==="mercado" ? "A lista do mercado está vazia." : "Nenhuma necessidade extra anotada ainda.")+'</p></section>';
    return head+intro+
      '<section class="ju-card"><span class="ju-label">'+done+' de '+list.length+' marcados</span>'+
        '<div style="display:flex;gap:8px;margin-top:10px"><input id="juShopNew" placeholder="'+(tab==="mercado"?"Novo item (ex.: leite, aveia…)":"Novo item (ex.: papel toalha, ração do Otto…)")+'" autocomplete="off" style="flex:1;min-width:0;font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--j-line);background:var(--j-surface);color:var(--j-ink)">'+
        '<button class="ju-plus" data-shopadd="'+tab+'" aria-label="Adicionar">'+ico("plus")+'</button></div></section>'+
      body+
      (done ? '<button class="ju-btn ghost block" data-shopreset="'+tab+'">Desmarcar todos (novo mês)</button>' : '')+
      (tab==="mercado" ? '<button class="ju-btn ghost block" data-legacy="dieta">Ver cardápio da dieta</button>' : '');
  }

  function viewEu(){
    var ht = habitsToday(), allHabits = J().habits, best = 0;
    allHabits.forEach(function(h){ best = Math.max(best, habitStreak(h)); });
    var moods = Object.keys(J().mood).length, nights = Object.keys(J().sleep).length;
    var tiles = [["metas","Metas","target","financas"],["dividas","Dívidas","coin","bemestar"],["financeiro","Relatório","chart","financas"],
      ["dieta","Dieta","apple","habitos"],["treino","Treino","dumb","treino"],["rotina","Horários","cal","agenda"],
      ["compras","Compras","bag","tarefas"],["leitura","Leitura","book","sono"],["espirito","Fé","cross","agenda"],
      ["academico","Faculdade","cap","agua"],["complementar","Cursos","spark","sono"],["profissional","Trabalho","briefcase","tarefas"],
      ["progresso","Progresso","trend","habitos"],["projecoes","Projeções","star","financas"]];
    var status = (document.getElementById("saveStatus")||{}).textContent || "";
    return ''+
    '<section class="ju-card ju-me"><img src="fotos/avatar.jpg" alt="Foto da Ju"><div style="min-width:0"><h2>Ju</h2><p class="ju-muted" style="margin:2px 0 0">'+esc(status||"Seu painel pessoal")+'</p></div></section>'+
    '<div class="ju-grid">'+stat("🔥","Maior sequência", best+(best===1?" dia":" dias"))+stat("🌿","Hábitos hoje", ht.done+"/"+ht.total)+
      stat("📝","Dias no diário", String(moods))+stat("🌙","Noites registradas", String(nights))+'</div>'+
    '<section class="ju-card"><div class="ju-head"><span class="ic">'+ico("grid")+'</span><h3>Seu painel completo</h3></div><div class="ju-tiles">'+
      tiles.map(function(t){ return '<button class="ju-tile" data-legacy="'+t[0]+'" style="'+tone(t[3])+'"><i>'+ico(t[2])+'</i>'+t[1]+'</button>'; }).join("")+'</div></section>'+
    '<section class="ju-card"><div class="ju-head"><span class="ic">'+ico("user")+'</span><h3>Ajustes</h3></div>'+
      '<div class="ju-row"><span>Meta de sono (horas)</span><input id="juGoal" type="number" min="4" max="12" step="0.5" value="'+(+J().sleepGoal||7)+'"></div>'+
      '<div class="ju-row"><span>Duração do ciclo (dias)</span><input id="juCycleLen" type="number" min="18" max="45" value="'+(+J().cycle.len||28)+'"></div>'+
      '<div class="ju-row"><span>Dias de menstruação</span><input id="juCycleDur" type="number" min="2" max="10" value="'+(+J().cycle.dur||5)+'"></div>'+
      '<div class="ju-grid" style="margin-top:12px"><button class="ju-btn soft" data-proxy="accountButton">Minha conta</button><button class="ju-btn ghost" data-proxy="exportBackup">Exportar backup</button>'+
      '<button class="ju-btn ghost" data-proxy="importBackupButton">Restaurar backup</button><button class="ju-btn ghost" data-proxy="installApp" id="juInstall">Instalar app</button></div></section>';
  }

  function renderView(view){
    var el = document.querySelector('.ju-view[data-view="'+view+'"]'); if(!el) return;
    var fn = {inicio:viewInicio, plano:viewPlano, tracker:viewTracker, financas:viewFinancas, sono:viewSono, bemestar:viewBemestar, tarefas:viewTarefas, compras:viewCompras, eu:viewEu}[view];
    var sub = ["financas","sono","tarefas","compras"].indexOf(view)>-1;
    el.innerHTML = (sub ? '<div class="ju-sub"><button class="ju-back" data-go="inicio" aria-label="Voltar">'+ico("back")+'</button></div>' : '') + fn();
    if(view==="inicio") renderAgora();
    if(view==="eu"){ var ib = document.getElementById("installApp"); var ji = document.getElementById("juInstall"); if(ji && ib && ib.hidden) ji.hidden = true; }
  }
  function renderShell(){
    if(!document.getElementById("ju") || !state) return;
    J();
    var d = new Date(), lbl = d.toLocaleDateString("pt-BR",{weekday:"short", day:"2-digit", month:"short"}).replace(/\./g,"");
    document.getElementById("juDate").lastChild.textContent = lbl.charAt(0).toUpperCase()+lbl.slice(1);
    var st = document.getElementById("saveStatus"); document.getElementById("juSync").textContent = st ? st.textContent : "";
    renderView(juView);
  }

  // ---------- events ----------
  function initShell(){
    var root = document.createElement("div");
    root.innerHTML =
      '<div class="ju" id="ju">'+
        '<header class="ju-top"><button class="ju-avatar" data-go="eu" aria-label="Seu perfil"><img src="fotos/avatar.jpg" alt=""></button>'+
        '<h1 id="juTitle">Hoje</h1><span class="ju-date" id="juDate">'+ico("cal")+'<span></span></span></header>'+
        '<div class="ju-sync" id="juSync" aria-live="polite"></div>'+
        ["inicio","plano","tracker","financas","sono","bemestar","tarefas","compras","eu"].map(function(v){ return '<section class="ju-view" data-view="'+v+'" hidden></section>'; }).join("")+
      '</div>'+
      '<nav class="ju-nav" aria-label="Navegação principal"><div>'+
        [["inicio","Início","home"],["plano","Meu plano","cal"],["tracker","Tracker","tasks"],["bemestar","Bem-estar","heart"],["eu","Você","user"]]
          .map(function(n){ return '<button data-go="'+n[0]+'">'+ico(n[2])+'<span>'+n[1]+'</span></button>'; }).join("")+
      '</div></nav>';
    while(root.firstChild) document.body.insertBefore(root.firstChild, document.body.firstChild);
    var bar = document.createElement("div"); bar.className = "ju-legacy-bar";
    bar.innerHTML = '<button class="ju-back" id="juLegacyBack" aria-label="Voltar">'+ico("back")+'</button><strong id="juLegacyTitle">Painel</strong>';
    var app = document.querySelector("body > .app"); app.parentNode.insertBefore(bar, app);
    document.body.classList.add("ju-on");
    document.getElementById("juLegacyBack").addEventListener("click", function(){ renderAll(); go(juView==="eu"?"eu":juView); });

    // keep the sync line in step with the save status
    var st = document.getElementById("saveStatus");
    if(st && window.MutationObserver) new MutationObserver(function(){ var s = document.getElementById("juSync"); if(s) s.textContent = st.textContent; }).observe(st, {childList:true, characterData:true, subtree:true});

    document.addEventListener("click", function(e){
      var t = e.target.closest("[data-go],[data-act],[data-legacy],[data-task],[data-habit],[data-water],[data-pay],[data-deltx],[data-deltask],[data-delhabit],[data-day],[data-month],[data-mood],[data-proxy],[data-shop],[data-shoptab],[data-shopadd],[data-shopreset],[data-delshop],[data-treino],#juPhoto");
      if(!t || !t.closest(".ju, .ju-nav, .ju-legacy-bar")) return;
      if(t.id==="juPhoto"){ photoOffset++; var img = document.getElementById("juPhotoImg"); if(img) img.src = photoOfDay(photoOffset); return; }
      if(t.dataset.go){ go(t.dataset.go); return; }
      if(t.dataset.treino){ var wl = state.workout.log || (state.workout.log = {}), tk2 = todayKey(); if(wl[tk2]) delete wl[tk2]; else { wl[tk2] = true; toast("Treino registrado 💪"); } save(); return; }
      if(t.dataset.shoptab){ juShopTab = t.dataset.shoptab; renderView("compras"); return; }
      if(t.dataset.shop || t.dataset.delshop){
        var ref = (t.dataset.shop||t.dataset.delshop).split(":"), arr = ref[0]==="extras" ? shopData().extras : shopData().items;
        if(t.dataset.delshop){ armDelete(t, function(){ var a2 = ref[0]==="extras" ? shopData().extras : shopData().items; var ix = a2.map(function(x){return x.id;}).indexOf(ref[1]); if(ix>-1){ a2.splice(ix,1); save(); } }); return; }
        var it = arr.filter(function(x){ return x.id===ref[1]; })[0]; if(it){ it.checked = !it.checked; save(); } return;
      }
      if(t.dataset.shopadd){
        var inp = document.getElementById("juShopNew"), txt = inp ? inp.value.trim() : "";
        if(!txt){ if(inp) inp.focus(); return; }
        var tgt = t.dataset.shopadd==="extras" ? shopData().extras : shopData().items;
        tgt.push({id:uid(t.dataset.shopadd==="extras"?"x":"c"), text:txt, category:t.dataset.shopadd==="extras"?"Extras":"Outros", checked:false});
        save(); toast("Item adicionado"); var n2 = document.getElementById("juShopNew"); if(n2) n2.focus(); return;
      }
      if(t.dataset.shopreset){ (t.dataset.shopreset==="extras" ? shopData().extras : shopData().items).forEach(function(i){ i.checked = false; }); save(); toast("Lista pronta para o novo mês"); return; }
      if(t.dataset.legacy){ openLegacy(t.dataset.legacy); return; }
      if(t.dataset.proxy){ var b = document.getElementById(t.dataset.proxy); if(b) b.click(); return; }
      var k = todayKey();
      if(t.dataset.act){
        var a = t.dataset.act;
        if(a==="gasto"||a==="entrada") sheetTx(a);
        else if(a==="bill") sheetBill("bill"); else if(a==="sub") sheetBill("sub");
        else if(a==="sleep") sheetSleep(); else if(a==="mood") sheetMood(k);
        else if(a==="task") sheetTask(); else if(a==="habit") sheetHabit();
        else if(a==="period"){ var s = J().cycle.starts || (J().cycle.starts=[]); if(s.indexOf(k)<0){ s.push(k); save(); toast("Início do ciclo registrado"); } else toast("Hoje já está registrado"); }
        return;
      }
      if(t.dataset.task){ var tk = J().tasks.filter(function(x){ return x.id===t.dataset.task; })[0]; if(tk){ tk.feita = !tk.feita; save(); } return; }
      if(t.dataset.habit){ var h = J().habits.filter(function(x){ return x.id===t.dataset.habit; })[0]; if(h){ var on = !habitDone(h,k); setHabit(h,k,on); save(); if(on) toast(h.em+" "+h.nome+" ✓"); } return; }
      if(t.dataset.water){ var cur = state.diet.log[k] || {water:0, notes:""}; var n = +t.dataset.water; cur.water = (cur.water===n && t.classList.contains("g")) ? n-1 : n; state.diet.log[k] = cur; save(); if(cur.water===8) toast("Meta de água batida! 💧"); return; }
      if(t.dataset.pay){
        var id = t.dataset.pay, mo = J().money, mk = monthKey(new Date());
        var b2 = mo.bills.filter(function(x){ return x.id===id; })[0] || mo.subs.filter(function(x){ return x.id===id; })[0];
        if(!b2) return;
        if(b2.recorrente || mo.subs.indexOf(b2)>-1){ b2.pagos = b2.pagos || {}; b2.pagos[mk] = true; } else b2.pago = true;
        mo.tx.unshift({id:uid("tx"), tipo:"saida", valor:b2.valor, desc:b2.nome, cat:mo.subs.indexOf(b2)>-1?"lazer":"contas", data:k});
        save(); toast(b2.nome+" paga e lançada nos gastos"); return;
      }
      if(t.dataset.deltx){ armDelete(t, function(){ var mo = J().money; mo.tx = mo.tx.filter(function(x){ return x.id!==t.dataset.deltx; }); save(); toast("Lançamento apagado"); }); return; }
      if(t.dataset.deltask){ armDelete(t, function(){ J().tasks = J().tasks.filter(function(x){ return x.id!==t.dataset.deltask; }); save(); }); return; }
      if(t.dataset.delhabit){ armDelete(t, function(){ J().habits = J().habits.filter(function(x){ return x.id!==t.dataset.delhabit; }); save(); toast("Hábito removido"); }); return; }
      if(t.dataset.mood){ var m = J().mood[k] || {}; m.v = +t.dataset.mood; J().mood[k] = m; save(); toast("Humor registrado"); return; }
      if(t.dataset.month){ juMonth = new Date(juMonth.getFullYear(), juMonth.getMonth()+(+t.dataset.month), 1); renderView("bemestar"); return; }
      if(t.dataset.day){
        if(juView==="plano"){ juPlanDay = +t.dataset.day; renderView("plano"); }
        else sheetMood(t.dataset.day);
      }
    });
    document.addEventListener("keydown", function(e){
      if(e.key==="Enter" && e.target && e.target.id==="juShopNew"){ e.preventDefault(); var b = document.querySelector("[data-shopadd]"); if(b) b.click(); }
    });
    document.addEventListener("change", function(e){
      var id = e.target.id, v = parseFloat(e.target.value);
      if(id==="juGoal" && v>=4 && v<=12){ J().sleepGoal = v; persist(); toast("Meta de sono atualizada"); }
      if(id==="juCycleLen" && v>=18 && v<=45){ J().cycle.len = Math.round(v); persist(); }
      if(id==="juCycleDur" && v>=2 && v<=10){ J().cycle.dur = Math.round(v); persist(); }
    });
    var saved = "inicio"; try{ saved = localStorage.getItem("painelJuView") || "inicio"; }catch(e){}
    juView = ["inicio","plano","tracker","financas","sono","bemestar","tarefas","compras","eu"].indexOf(saved)>-1 ? saved : "inicio";
  }
  function shellStart(){ go(juView); }


  async function init(){
    initToday();
    initTabs();
    initBackups();
    initAppInstall();
    initAccount();
    initShell();
    var cache = readJSON(CACHE_KEY);
    state = cache ? mergeDefaults(cache) : cloneDefaults();
    stateDoc = localStore;
    reconcileState();
    renderAll();
    shellStart();
    setSaveStatus("saving", cache ? "Abrindo seus dados…" : "Entre para carregar seus dados");
    try{
      var ok = await connect();
      if(!ok){ updateAccountUi(); setSaveStatus("ok", cache ? "Salvo neste aparelho — entre para sincronizar" : "Entre para carregar seus dados"); }
    }catch(e){
      console.warn("painel: conta indisponível", e);
      updateAccountUi();
      setSaveStatus(navigator.onLine ? "error" : "ok", navigator.onLine ? "Não foi possível conectar à conta agora" : "Sem internet — usando os dados deste aparelho");
    }
    setInterval(function(){ subscribeDirecao(); renderAgora(); }, 30000);
    document.addEventListener("visibilitychange", function(){ if(!document.hidden){ subscribeDirecao(); renderAgora(); } });
  }

  document.addEventListener("DOMContentLoaded", init);
  if("serviceWorker" in navigator && window.isSecureContext && location.protocol!=="file:"){
    window.addEventListener("load",function(){
      navigator.serviceWorker.register("./service-worker.js").catch(function(error){
        console.error("Falha ao registrar suporte offline:",error);
      });
    });
  }
})();
</script>

</body></html>
